<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">单词听写</title>
  <g transform="rotate(-3 64 64)">
    <!-- 对话气泡底：左下角小圆角，呼应页面 .brand-mark -->
    <path d="M40 10h48a30 30 0 0 1 30 30v44a30 30 0 0 1-30 30H18a8 8 0 0 1-8-8V40a30 30 0 0 1 30-30z" fill="#173b57"/>
    <!-- 声波：代表朗读与听写 -->
    <circle cx="86" cy="32" r="4.5" fill="#ff7657"/>
    <g fill="none" stroke="#ffd34e" stroke-width="5" stroke-linecap="round">
      <path d="M93 25a10 10 0 0 1 0 14"/>
      <path d="M100 19a18 18 0 0 1 0 26"/>
    </g>
    <!-- 手写体 A 和单层 a -->
    <g fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26 88 45 36 64 88"/>
      <path d="M33 70h24"/>
      <circle cx="84" cy="74" r="12"/>
      <path d="M96 60v28"/>
    </g>
    <!-- 书写线：纸上听写 -->
    <path d="M24 101h76" fill="none" stroke="#85d8bd" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
